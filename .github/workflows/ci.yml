name: CI

on:
  pull_request:
    branches: [develop, main]

# 같은 PR에 연속으로 push하면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트 · 타입 검사 · 포맷 검사 · 빌드
        run: npm run check
